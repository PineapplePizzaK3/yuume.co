name: Refresh hot catalog queries

on:
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:

jobs:
  refresh-hot-queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh stale hot searches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/catalog/refresh-hot-queries.mjs --limit=12
