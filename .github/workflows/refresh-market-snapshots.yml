name: Refresh Market Snapshots

on:
  schedule:
    # A cada 6 horas — own_stock only until D1 clears API sources.
    - cron: '20 */6 * * *'
  workflow_dispatch:

jobs:
  refresh-market-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run snapshot job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/catalog/refresh-market-snapshots.mjs --limit=80
