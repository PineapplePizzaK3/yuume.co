name: Refresh On-Demand SNKRDUNK Catalog

on:
  schedule:
    # A cada 1 hora — atualiza preços JPY do catálogo On-Demand.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh SNKRDUNK On-Demand catalog
        run: npm run catalog:on-demand:refresh

      - name: Build Live Rips box/pack catalog
        run: npm run catalog:live-rips:box-pack

      - name: Commit and push if catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/onDemandSnkrdunkCatalog.js src/data/liveRipsSnkrdunkCatalog.js scripts/on-demand/snkrdunk-box-pack.raw.json

          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh On-Demand and Live Rips box/pack catalogs"
          git push
